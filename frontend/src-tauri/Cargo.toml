[package]
name = "voicetype"
version = "1.0.0"
description = "VoiceType desktop controller"
authors = ["VoiceType"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
