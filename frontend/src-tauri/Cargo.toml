[package]
name = "voicetype"
version = "0.1.0"
description = "VoiceType desktop controller"
authors = ["VoiceType"]
edition = "2021"

[lib]
name = "voicetype_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
